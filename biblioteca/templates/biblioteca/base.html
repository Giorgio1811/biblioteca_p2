<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Biblioteca IESB{% endblock %}</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #1f2937; background: #f5f7fb; }
        body { max-width: 1050px; margin: 2rem auto; padding: 0 1rem; }
        nav { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1rem; background: #fff; border-radius: 8px; }
        a { color: #174ea6; }
        table { border-collapse: collapse; width: 100%; background: #fff; }
        th, td { border: 1px solid #d1d5db; padding: 8px 10px; text-align: left; vertical-align: top; }
        th { background: #eef2f7; }
        form { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
        button { cursor: pointer; padding: .35rem .65rem; }
        .msg { padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
        .msg.success { background: #d4edda; }
        .msg.error { background: #f8d7da; }
        .msg.warning { background: #fff3cd; }
        .atrasado { color: #b42318; font-weight: bold; }
        .devolvido { color: #18794e; }
        .andamento { color: #9a6700; }
        .reserva { margin: .35rem 0; font-size: .9rem; }
        .cards { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
        .card { flex: 1; min-width: 150px; padding: 1rem; background: #fff; border-radius: 8px; }
        @media (max-width: 650px) { body { margin-top: 1rem; } table { font-size: .9rem; } }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'lista_livros' %}">Acervo</a>
        <a href="{% url 'relatorio_livros' %}">Relatório</a>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="/admin/">Admin</a>
    </nav>
    <hr>
    {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
</body>
</html>
